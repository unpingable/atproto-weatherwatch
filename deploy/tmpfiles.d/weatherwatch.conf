# Weatherwatch's own paths. Install to /etc/tmpfiles.d/ and run `systemd-tmpfiles --create weatherwatch.conf`
# after sysusers.d/weatherwatch.conf.
# The webroot belongs to the publisher; the web server only needs to read it.
d /var/lib/weatherwatch        0755 weatherwatch weatherwatch -
d /var/lib/weatherwatch/build  0755 weatherwatch weatherwatch -
d /var/www/weatherwatch        0755 weatherwatch weatherwatch -
d /var/lib/weatherwatch/metrics 0755 weatherwatch weatherwatch -
