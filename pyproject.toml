[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "weatherwatch"
version = "0.1.0rc5"
description = "Aggregate ATProto event weather telemetry. Counts the weather, keeps no people."
requires-python = ">=3.10"
license = {text = "MIT OR Apache-2.0"}
dependencies = [
    "tomli>=2; python_version < '3.11'",
    "websockets>=10.4",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.scripts]
weatherwatch = "weatherwatch.cli:main"

[tool.setuptools.package-data]
weatherwatch = ["_ops/*.toml", "_instruments/*.css", "_instruments/*.json", "_instruments/fonts/*"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
